[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-patch-smart-router"
version = "0.1.0"
description = "Safe local router that selects Codex model, profile, sandbox, and settings from prompt risk and complexity"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "LuciferSun" }
]
dependencies = []

[project.scripts]
smart-codex = "smart_codex.cli:main"

[tool.setuptools.packages.find]
include = ["smart_codex*"]
exclude = ["examples*", "profiles*", "rules*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
